[package]
name = "webrtc-engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Media engine for WebRTC calls on top of webrtc-rs: platform voice processing, Opus and a jitter buffer"
repository = "https://github.com/FlickerTalk/webrtc-engine-rs"

[dependencies]
bytes = "1"
cpal = { version = "0.18", optional = true }
rand = "0.10"
rtc = "0.21"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
webrtc = "0.21"

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

[build-dependencies]
cc = "1.5.1"

[features]
# The desktop backend (cpal), for trying the engine on a computer. Mobile builds leave it out.
desktop = ["dep:cpal"]

[[example]]
name = "mic_echo"
required-features = ["desktop"]
test = true
