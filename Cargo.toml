[package]
name = "webrtc-engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Media engine for WebRTC calls on top of webrtc-rs: platform voice processing, Opus and a jitter buffer"
repository = "https://github.com/FlickerTalk/webrtc-engine-rs"

[dependencies]
bytes = "1"
cpal = { version = "0.18", optional = true }
rand = "0.10"
rtc = "0.21"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
webrtc = "0.21"

# dlopen/dlsym for AAudio: loaded at run time, so the library still loads on Android 7 (API 24).
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

# iOS video (`video::ios`): the Objective-C runtime for AVFoundation and Core Animation. The C
# frameworks (CoreMedia, CoreVideo, VideoToolbox) are declared by hand in `video/ios/ffi.rs`.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

[build-dependencies]
cc = "1.5.1"

[features]
# The desktop backend (cpal), for trying the engine on a computer. Mobile builds leave it out.
desktop = ["dep:cpal"]

[[example]]
name = "mic_echo"
required-features = ["desktop"]
test = true

[[example]]
name = "call_demo"
required-features = ["desktop"]
test = true
