# Checks every change: format, lints (with and without the desktop backend) and tests on macOS,
# plus the builds for the two phones: iOS on macOS, Android with the NDK on Ubuntu. The desktop
# feature is left out of the phone builds and of Ubuntu, where cpal would need ALSA headers.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      # Tests that need a microphone stay #[ignore]; the loopback call uses 127.0.0.1 only.
      - run: cargo test --all-features --locked
      - name: iOS lints and build
        run: |
          cargo clippy --all-targets --target aarch64-apple-ios --locked -- -D warnings
          cargo build --target aarch64-apple-ios --locked
        env:
          # Without it clang stamps libopus with the SDK version as minimum iOS.
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Android build
        # The runner image ships an NDK; libopus is compiled with its clang.
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android24-clang"
          cargo build --target aarch64-linux-android --locked
